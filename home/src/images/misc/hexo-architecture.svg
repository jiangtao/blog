<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="hexo-title hexo-desc">
  <title id="hexo-title">Hexo 手动时代架构</title>
  <desc id="hexo-desc">从 Markdown、图片和主题配置进入 Hexo Engine，再手动部署到 CDN 的博客发布链路，并标出手动封面、链接失效、60s+ 构建和易漏文件等瓶颈。</desc>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 28px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 14px; fill: #475569; }
    .stage-label { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
    .stage-num { font-size: 12px; font-weight: 800; fill: #ffffff; }
    .node-title { font-size: 15px; font-weight: 800; fill: #0f172a; }
    .node-copy { font-size: 12px; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 800; }
    .risk-title { font-size: 14px; font-weight: 800; fill: #991b1b; }
    .risk-copy { font-size: 12px; fill: #7c2d12; }
    .watermark { font-size: 12px; fill: #94a3b8; }
  </style>

  <rect width="960" height="560" fill="#f8fbff"/>
  <path d="M 36 86 H 924 V 392 H 36 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
  <path d="M 36 408 H 924 V 520 H 36 Z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>

  <text class="title" x="480" y="42" text-anchor="middle">Hexo 手动时代：发布链路与瓶颈</text>
  <text class="subtitle" x="480" y="66" text-anchor="middle">人工准备内容和素材，构建与部署依赖脚本，问题集中在慢、漏、断链和重复劳动。</text>

  <g transform="translate(50 96)">
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">1</text>
    <text class="stage-label" x="96" y="20" text-anchor="middle">内容输入</text>
  </g>
  <g transform="translate(280 96)">
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">2</text>
    <text class="stage-label" x="98" y="20" text-anchor="middle">生成引擎</text>
  </g>
  <g transform="translate(510 96)">
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">3</text>
    <text class="stage-label" x="100" y="20" text-anchor="middle">静态产物</text>
  </g>
  <g transform="translate(740 96)">
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">4</text>
    <text class="stage-label" x="102" y="20" text-anchor="middle">手动发布</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="50" y="132" width="170" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="135" y="154" text-anchor="middle">Markdown 文章</text>
    <text class="node-copy" x="135" y="174" text-anchor="middle">source/_posts</text>

    <rect x="50" y="218" width="170" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="135" y="240" text-anchor="middle">图片与封面</text>
    <text class="node-copy" x="135" y="260" text-anchor="middle">手动裁切上传</text>

    <rect x="50" y="304" width="170" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="135" y="326" text-anchor="middle">主题与配置</text>
    <text class="node-copy" x="135" y="346" text-anchor="middle">Next / YAML</text>

    <rect x="280" y="218" width="170" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text class="node-title" x="365" y="240" text-anchor="middle">Hexo Engine</text>
    <text class="node-copy" x="365" y="260" text-anchor="middle">模板渲染 + 插件</text>
    <rect x="388" y="225" width="42" height="18" rx="9" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
    <text class="badge-text" x="409" y="238" text-anchor="middle" fill="#c2410c">60s+</text>

    <rect x="510" y="218" width="170" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text class="node-title" x="595" y="240" text-anchor="middle">public/ 静态站</text>
    <text class="node-copy" x="595" y="260" text-anchor="middle">HTML / CSS / JS</text>

    <rect x="740" y="132" width="170" height="58" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text class="node-title" x="825" y="154" text-anchor="middle">deploy.sh</text>
    <text class="node-copy" x="825" y="174" text-anchor="middle">人工执行上传</text>
    <rect x="858" y="139" width="48" height="18" rx="9" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
    <text class="badge-text" x="882" y="152" text-anchor="middle" fill="#c2410c">手动</text>

    <rect x="740" y="304" width="170" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text class="node-title" x="825" y="326" text-anchor="middle">CDN / Pages</text>
    <text class="node-copy" x="825" y="346" text-anchor="middle">缓存与链接检查</text>
  </g>

  <g stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-main)">
    <path d="M 220 161 H 250 V 247 H 280"/>
    <path d="M 220 247 H 280"/>
    <path d="M 220 333 H 250 V 247 H 280"/>
    <path d="M 450 247 H 510"/>
    <path d="M 680 247 H 710 V 161 H 740"/>
    <path d="M 680 247 H 710 V 333 H 740"/>
  </g>

  <text x="50" y="424" font-size="14" font-weight="800" fill="#9a3412">瓶颈指标</text>
  <g filter="url(#card-shadow)">
    <rect x="50" y="438" width="170" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
    <text class="risk-title" x="135" y="462" text-anchor="middle">手动封面</text>
    <text class="risk-copy" x="135" y="482" text-anchor="middle">30min/篇，重复劳动</text>

    <rect x="280" y="438" width="170" height="62" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
    <text class="risk-title" x="365" y="462" text-anchor="middle">链接失效</text>
    <text class="risk-copy" x="365" y="482" text-anchor="middle">图片/CDN 易 404</text>

    <rect x="510" y="438" width="170" height="62" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text class="risk-title" x="595" y="462" text-anchor="middle">60s+ 构建</text>
    <text class="risk-copy" x="595" y="482" text-anchor="middle">反馈慢，调试成本高</text>

    <rect x="740" y="438" width="170" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text class="risk-title" x="825" y="462" text-anchor="middle">易漏文件</text>
    <text class="risk-copy" x="825" y="482" text-anchor="middle">人工发布缺少校验</text>
  </g>

  <text class="watermark" x="912" y="540" text-anchor="end">Jerret's Blog</text>
</svg>
