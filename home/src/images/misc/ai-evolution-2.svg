<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">工作流标准化</title>
  <desc id="desc">四阶段展示个人习惯、显性规则、自动检查、可复制团队流程的演进。</desc>
  <defs>
    <style>
      .font { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 700; fill: #2563eb; }
      .stage-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .stage-text { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .badge { font-size: 12px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="138%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>
  <path d="M48 98 H912 M48 318 H912" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M60 120 V292 M286 120 V292 M512 120 V292 M738 120 V292" stroke="#f1f5f9" stroke-width="1"/>

  <text x="480" y="46" text-anchor="middle" class="font title">2. 工作流标准化</text>
  <rect x="332" y="66" width="296" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="86" text-anchor="middle" class="font subtitle">规则写下来，工具跑起来</text>

  <line x1="232" y1="206" x2="274" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="206" x2="500" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="684" y1="206" x2="726" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(60,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#f97316"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">01</text>
    <text x="84" y="68" text-anchor="middle" class="font stage-title">个人习惯</text>
    <text x="84" y="90" text-anchor="middle" class="font stage-title">散乱流程</text>
    <text x="84" y="120" text-anchor="middle" class="font stage-text">口口相传</text>
    <text x="84" y="140" text-anchor="middle" class="font stage-text">每次重想</text>
  </g>

  <g transform="translate(286,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#2563eb"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">02</text>
    <text x="84" y="72" text-anchor="middle" class="font stage-title">显性规则</text>
    <text x="84" y="102" text-anchor="middle" class="font stage-text">写入文档</text>
    <text x="84" y="122" text-anchor="middle" class="font stage-text">沉淀边界</text>
    <text x="84" y="142" text-anchor="middle" class="font stage-text">统一输入</text>
  </g>

  <g transform="translate(512,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#7c3aed"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">03</text>
    <text x="84" y="72" text-anchor="middle" class="font stage-title">自动检查</text>
    <text x="84" y="102" text-anchor="middle" class="font stage-text">脚本验证</text>
    <text x="84" y="122" text-anchor="middle" class="font stage-text">CI 报告</text>
    <text x="84" y="142" text-anchor="middle" class="font stage-text">失败即修</text>
  </g>

  <g transform="translate(738,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#059669"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">04</text>
    <text x="84" y="68" text-anchor="middle" class="font stage-title">可复制</text>
    <text x="84" y="90" text-anchor="middle" class="font stage-title">团队流程</text>
    <text x="84" y="120" text-anchor="middle" class="font stage-text">新人照跑</text>
    <text x="84" y="140" text-anchor="middle" class="font stage-text">结果一致</text>
  </g>

  <g transform="translate(60,324)">
    <rect width="846" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="24" y="15" width="72" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="60" y="33" text-anchor="middle" class="font badge" fill="#1d4ed8">规则层</text>
    <text x="120" y="33" class="font tiny">输入、步骤、验收标准先写清楚</text>
    <rect x="482" y="15" width="72" height="26" rx="13" fill="#ecfdf5" stroke="#86efac"/>
    <text x="518" y="33" text-anchor="middle" class="font badge" fill="#047857">工具层</text>
    <text x="578" y="33" class="font tiny">检查、反馈、同步交给脚本和 AI</text>
  </g>

  <text x="920" y="396" text-anchor="end" class="font tiny" fill="#94a3b8">Jerret's Blog</text>
</svg>
