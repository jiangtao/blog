<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#2563eb"/>
    </marker>
    <filter id="softShadow" x="-18%" y="-24%" width="136%" height="148%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>
  <rect width="960" height="420" fill="url(#grid)"/>
  <rect x="24" y="22" width="912" height="376" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="480" y="58" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" letter-spacing="0" fill="#0f172a">5. 零成本迭代</text>
  <text x="480" y="86" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#64748b">试错成本下降，质量不靠一次命中，而靠自动门禁持续兜底</text>

  <path d="M 120 185 H 840" fill="none" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round"/>
  <path d="M 218 185 H 284" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 450 185 H 516" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 682 185 H 748" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 832 251 V278 H 365 V251" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="600" y="270" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#6d28d9">反馈继续下一轮</text>

  <g transform="translate(52,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#f97316"/>
    <circle cx="29" cy="37" r="15" fill="#ffedd5" stroke="#fdba74"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">1</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">高成本设计/等待</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">排期、沟通、返工</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">一次失败就拖慢节奏</text>
    <rect x="20" y="101" width="68" height="18" rx="9" fill="#ffedd5"/>
    <text x="54" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#c2410c">等待高</text>
  </g>

  <g transform="translate(284,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#2563eb"/>
    <circle cx="29" cy="37" r="15" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">2</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">AI 快速试错</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">分钟级生成多方案</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">不满意即可重来</text>
    <rect x="20" y="101" width="68" height="18" rx="9" fill="#dbeafe"/>
    <text x="54" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#1d4ed8">低摩擦</text>
  </g>

  <g transform="translate(516,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#16a34a"/>
    <circle cx="29" cy="37" r="15" fill="#dcfce7" stroke="#86efac"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">3</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">自动验证</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">lint、构建、预览</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">先过门禁再推进</text>
    <rect x="20" y="101" width="58" height="18" rx="9" fill="#dcfce7"/>
    <text x="49" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#15803d">门禁</text>
  </g>

  <g transform="translate(748,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#7c3aed"/>
    <circle cx="29" cy="37" r="15" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">4</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">多轮小步迭代</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">每轮只改关键问题</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">小失败换来快收敛</text>
    <rect x="20" y="101" width="58" height="18" rx="9" fill="#ede9fe"/>
    <text x="49" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#6d28d9">小步</text>
  </g>

  <g transform="translate(72,318)">
    <rect width="260" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="20" y="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#c2410c">试错成本</text>
    <text x="100" y="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#0f172a">天级沟通 → 分钟级反馈</text>
  </g>
  <g transform="translate(350,318)">
    <rect width="260" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="20" y="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#15803d">质量兜底</text>
    <text x="100" y="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#0f172a">门禁发现问题并阻断</text>
  </g>
  <g transform="translate(628,318)">
    <rect width="260" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="20" y="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#1d4ed8">迭代节奏</text>
    <text x="100" y="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#0f172a">多轮小步替代大返工</text>
  </g>

  <text x="936" y="398" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Jerret's Blog</text>
