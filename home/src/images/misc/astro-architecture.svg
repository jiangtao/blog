<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="astro-title astro-desc">
  <title id="astro-title">Astro 静态化系统架构</title>
  <desc id="astro-desc">Markdown、组件、布局和资源进入 Astro Build，输出 Static HTML、Pagefind/RSS 与 Vercel 部署，并标出 10s 构建、零 JS 默认、TypeScript 和 Islands 等收益。</desc>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-good" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#059669"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 28px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 14px; fill: #475569; }
    .stage-label { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
    .stage-num { font-size: 12px; font-weight: 800; fill: #ffffff; }
    .node-title { font-size: 15px; font-weight: 800; fill: #0f172a; }
    .node-copy { font-size: 12px; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 800; }
    .metric-title { font-size: 14px; font-weight: 800; fill: #065f46; }
    .metric-copy { font-size: 12px; fill: #0f766e; }
    .watermark { font-size: 12px; fill: #94a3b8; }
  </style>

  <rect width="960" height="560" fill="#f7fbff"/>
  <path d="M 36 86 H 924 V 392 H 36 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
  <path d="M 36 408 H 924 V 520 H 36 Z" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.5"/>

  <text class="title" x="480" y="42" text-anchor="middle">Astro 静态化系统：更快的构建与更轻的页面</text>
  <text class="subtitle" x="480" y="66" text-anchor="middle">内容、组件和资源进入统一构建管线，产物天然静态化，搜索、订阅与部署由工具链接管。</text>

  <g transform="translate(54 96)">
    <rect x="0" y="0" width="168" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">1</text>
    <text class="stage-label" x="94" y="20" text-anchor="middle">源码输入</text>
  </g>
  <g transform="translate(304 96)">
    <rect x="0" y="0" width="168" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">2</text>
    <text class="stage-label" x="94" y="20" text-anchor="middle">Astro Build</text>
  </g>
  <g transform="translate(554 96)">
    <rect x="0" y="0" width="168" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">3</text>
    <text class="stage-label" x="96" y="20" text-anchor="middle">静态产物</text>
  </g>
  <g transform="translate(738 96)">
    <rect x="0" y="0" width="168" height="30" rx="15" fill="#dbeafe"/>
    <circle cx="18" cy="15" r="12" fill="#2563eb"/>
    <text class="stage-num" x="18" y="19" text-anchor="middle">4</text>
    <text class="stage-label" x="96" y="20" text-anchor="middle">自动交付</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="54" y="132" width="168" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="138" y="154" text-anchor="middle">Markdown</text>
    <text class="node-copy" x="138" y="174" text-anchor="middle">src/data/blog</text>

    <rect x="54" y="198" width="168" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="138" y="220" text-anchor="middle">Components</text>
    <text class="node-copy" x="138" y="240" text-anchor="middle">React / Astro Islands</text>

    <rect x="54" y="264" width="168" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="138" y="286" text-anchor="middle">Layout</text>
    <text class="node-copy" x="138" y="306" text-anchor="middle">统一模板与导航</text>

    <rect x="54" y="330" width="168" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="node-title" x="138" y="352" text-anchor="middle">Assets</text>
    <text class="node-copy" x="138" y="372" text-anchor="middle">图片 / 样式 / OG</text>

    <rect x="304" y="264" width="168" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text class="node-title" x="388" y="286" text-anchor="middle">Astro Build</text>
    <text class="node-copy" x="388" y="306" text-anchor="middle">内容集合 + Vite</text>
    <rect x="410" y="271" width="46" height="18" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text class="badge-text" x="433" y="284" text-anchor="middle" fill="#15803d">10s</text>

    <rect x="554" y="150" width="168" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text class="node-title" x="638" y="172" text-anchor="middle">Static HTML</text>
    <text class="node-copy" x="638" y="192" text-anchor="middle">零 JS 默认输出</text>

    <rect x="554" y="264" width="168" height="56" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text class="node-title" x="638" y="286" text-anchor="middle">Pagefind / RSS</text>
    <text class="node-copy" x="638" y="306" text-anchor="middle">搜索与订阅索引</text>

    <rect x="738" y="264" width="168" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text class="node-title" x="822" y="286" text-anchor="middle">Vercel</text>
    <text class="node-copy" x="822" y="306" text-anchor="middle">自动部署 / CDN</text>
  </g>

  <g stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-main)">
    <path d="M 222 160 H 264 V 292 H 304"/>
    <path d="M 222 226 H 264 V 292 H 304"/>
    <path d="M 222 292 H 304"/>
    <path d="M 222 358 H 264 V 292 H 304"/>
    <path d="M 472 292 H 514 V 178 H 554"/>
    <path d="M 472 292 H 554"/>
  </g>
  <g stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)">
    <path d="M 722 178 H 730 V 292 H 738"/>
    <path d="M 722 292 H 738"/>
  </g>

  <text x="54" y="424" font-size="14" font-weight="800" fill="#047857">收益指标</text>
  <g filter="url(#card-shadow)">
    <rect x="54" y="438" width="168" height="62" rx="8" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.6"/>
    <text class="metric-title" x="138" y="462" text-anchor="middle">10s 构建</text>
    <text class="metric-copy" x="138" y="482" text-anchor="middle">反馈更快，发布更稳</text>

    <rect x="304" y="438" width="168" height="62" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/>
    <text class="metric-title" x="388" y="462" text-anchor="middle">零 JS 默认</text>
    <text class="metric-copy" x="388" y="482" text-anchor="middle">页面更轻，首屏更快</text>

    <rect x="554" y="438" width="168" height="62" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text class="metric-title" x="638" y="462" text-anchor="middle">TypeScript</text>
    <text class="metric-copy" x="638" y="482" text-anchor="middle">内容模型可校验</text>

    <rect x="738" y="438" width="168" height="62" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
    <text class="metric-title" x="822" y="462" text-anchor="middle">Islands</text>
    <text class="metric-copy" x="822" y="482" text-anchor="middle">只为交互加载 JS</text>
  </g>

  <text class="watermark" x="912" y="540" text-anchor="end">Jerret's Blog</text>
</svg>
