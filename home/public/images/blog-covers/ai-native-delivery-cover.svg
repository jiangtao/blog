<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">聊聊近来的 AI 所见所闻</title>
  <desc id="cover-desc">AI 加速输出，但需求验证、交付系统和组织治理需要同步跟上。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="52%" stop-color="#f3f7f1"/>
      <stop offset="100%" stop-color="#fff6ed"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f7a68"/>
      <stop offset="100%" stop-color="#f08a46"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#223042" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#223042" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowWarm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#d66b35"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#1f7a68"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="44" y="42" width="1112" height="546" rx="22" fill="#fffdf8" stroke="#d9e1da" stroke-width="1.5" filter="url(#softShadow)"/>

  <g opacity="0.55">
    <path d="M 82 126 H 1118" stroke="#e2e8e2" stroke-width="1"/>
    <path d="M 82 226 H 1118" stroke="#e2e8e2" stroke-width="1"/>
    <path d="M 82 326 H 1118" stroke="#e2e8e2" stroke-width="1"/>
    <path d="M 82 426 H 1118" stroke="#e2e8e2" stroke-width="1"/>
    <path d="M 300 78 V 552" stroke="#e9eee8" stroke-width="1"/>
    <path d="M 540 78 V 552" stroke="#e9eee8" stroke-width="1"/>
    <path d="M 780 78 V 552" stroke="#e9eee8" stroke-width="1"/>
    <path d="M 1020 78 V 552" stroke="#e9eee8" stroke-width="1"/>
  </g>

  <rect x="82" y="76" width="174" height="32" rx="16" fill="#e9f4ee" stroke="#b9d7c8"/>
  <text x="106" y="98" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#1f7a68">AI NATIVE DELIVERY</text>

  <text x="82" y="172" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="#1f2933">聊聊近来的</text>
  <text x="82" y="234" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800" fill="#1f2933">AI 所见所闻</text>
  <rect x="82" y="262" width="390" height="8" rx="4" fill="url(#signal)"/>

  <text x="82" y="316" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#2f3b45">输出变快，不等于交付系统变强</text>
  <text x="82" y="354" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#52606d">
    <tspan x="82" dy="0">需求试错变快，收益验证和生产消化没跟上，</tspan>
    <tspan x="82" dy="30">不确定性就会进入研发和交付链路。</tspan>
  </text>

  <g transform="translate(82 438)">
    <rect x="0" y="0" width="136" height="56" rx="12" fill="#f4faf6" stroke="#bdd8c8"/>
    <text x="18" y="25" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#1f7a68">需求验证</text>
    <text x="18" y="43" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#63736a">value first</text>
    <rect x="156" y="0" width="136" height="56" rx="12" fill="#fff7ec" stroke="#e3c39f"/>
    <text x="174" y="25" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#98572a">质量保障</text>
    <text x="174" y="43" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#7f6b59">observe</text>
    <rect x="312" y="0" width="136" height="56" rx="12" fill="#eef5ff" stroke="#b9cce4"/>
    <text x="330" y="25" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#2f5d83">组织共速</text>
    <text x="330" y="43" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#607084">shared speed</text>
  </g>

  <g transform="translate(604 92)">
    <rect x="0" y="0" width="472" height="424" rx="18" fill="#f7faf8" stroke="#cddbd1" stroke-width="1.5"/>
    <text x="34" y="46" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" fill="#31414f">最近看到的核心矛盾</text>

    <g>
      <rect x="34" y="76" width="404" height="76" rx="14" fill="#fff4ea" stroke="#e7a66e" stroke-width="1.5" filter="url(#smallShadow)"/>
      <circle cx="74" cy="114" r="18" fill="#f08a46"/>
      <text x="69" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">1</text>
      <text x="108" y="107" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" fill="#713f1f">需求端提速</text>
      <text x="108" y="132" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#6d4e3a">更多想法、更多试错、更多变化</text>
    </g>

    <path d="M 236 154 C 236 170 236 178 236 194" stroke="#d66b35" stroke-width="3" fill="none" marker-end="url(#arrowWarm)"/>

    <g>
      <rect x="34" y="196" width="404" height="76" rx="14" fill="#eef6ff" stroke="#9dbddd" stroke-width="1.5" filter="url(#smallShadow)"/>
      <circle cx="74" cy="234" r="18" fill="#3e78a4"/>
      <text x="69" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">2</text>
      <text x="108" y="227" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" fill="#244a68">研发侧承压</text>
      <text x="108" y="252" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#415d74">评审、联调、上线、回滚仍要兜住</text>
    </g>

    <path d="M 236 274 C 236 290 236 298 236 314" stroke="#1f7a68" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

    <g>
      <rect x="34" y="316" width="404" height="76" rx="14" fill="#edf8f2" stroke="#9ccdb4" stroke-width="1.5" filter="url(#smallShadow)"/>
      <circle cx="74" cy="354" r="18" fill="#1f7a68"/>
      <text x="69" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">3</text>
      <text x="108" y="347" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" fill="#1f5d4f">组织治理补齐</text>
      <text x="108" y="372" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#42685b">验证前置、平台打通、质量体系兜底</text>
    </g>
  </g>

  <text x="82" y="552" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#6b747d">PDE / FDE / Agent / 端到端交付 / 组织升级</text>
  <text x="1116" y="552" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8791">Jerret's Blog</text>
</svg>
