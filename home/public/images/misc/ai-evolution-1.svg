<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">AI 从辅助到主导</title>
  <desc id="desc">四阶段展示人工主导、AI 辅助、AI 起草人 Review、标准化自动执行的演进。</desc>
  <defs>
    <style>
      .font { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 700; fill: #2563eb; }
      .stage-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .stage-text { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .badge { font-size: 12px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="138%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>
  <path d="M48 98 H912 M48 318 H912" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M60 120 V292 M286 120 V292 M512 120 V292 M738 120 V292" stroke="#f1f5f9" stroke-width="1"/>

  <text x="480" y="46" text-anchor="middle" class="font title">1. AI 从辅助到主导</text>
  <rect x="308" y="66" width="344" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="86" text-anchor="middle" class="font subtitle">人负责判断，AI 承担重复执行</text>

  <line x1="232" y1="206" x2="274" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="206" x2="500" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="684" y1="206" x2="726" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(60,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#f97316"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">01</text>
    <text x="84" y="72" text-anchor="middle" class="font stage-title">人工主导</text>
    <text x="84" y="102" text-anchor="middle" class="font stage-text">人写方案</text>
    <text x="84" y="122" text-anchor="middle" class="font stage-text">人改细节</text>
    <text x="84" y="142" text-anchor="middle" class="font stage-text">人跑流程</text>
  </g>

  <g transform="translate(286,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#0891b2"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">02</text>
    <text x="84" y="72" text-anchor="middle" class="font stage-title">AI 辅助</text>
    <text x="84" y="102" text-anchor="middle" class="font stage-text">AI 给草稿</text>
    <text x="84" y="122" text-anchor="middle" class="font stage-text">人拆任务</text>
    <text x="84" y="142" text-anchor="middle" class="font stage-text">人补上下文</text>
  </g>

  <g transform="translate(512,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#2563eb"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">03</text>
    <text x="84" y="70" text-anchor="middle" class="font stage-title">AI 起草</text>
    <text x="84" y="92" text-anchor="middle" class="font stage-title">人 Review</text>
    <text x="84" y="122" text-anchor="middle" class="font stage-text">人定方向</text>
    <text x="84" y="142" text-anchor="middle" class="font stage-text">AI 批量执行</text>
  </g>

  <g transform="translate(738,120)" filter="url(#cardShadow)">
    <rect width="168" height="172" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <circle cx="84" cy="34" r="20" fill="#059669"/>
    <text x="84" y="40" text-anchor="middle" class="font badge" fill="#ffffff">04</text>
    <text x="84" y="70" text-anchor="middle" class="font stage-title">标准化</text>
    <text x="84" y="92" text-anchor="middle" class="font stage-title">自动执行</text>
    <text x="84" y="122" text-anchor="middle" class="font stage-text">规则触发</text>
    <text x="84" y="142" text-anchor="middle" class="font stage-text">工具闭环</text>
  </g>

  <g transform="translate(60,324)">
    <rect width="846" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="24" y="15" width="98" height="26" rx="13" fill="#fff7ed" stroke="#fdba74"/>
    <text x="73" y="33" text-anchor="middle" class="font badge" fill="#c2410c">人类判断</text>
    <text x="150" y="33" class="font tiny">目标、取舍、风险、验收仍由人负责</text>
    <rect x="506" y="15" width="80" height="26" rx="13" fill="#ecfdf5" stroke="#86efac"/>
    <text x="546" y="33" text-anchor="middle" class="font badge" fill="#047857">AI 执行</text>
    <text x="612" y="33" class="font tiny">生成、整理、检查、同步逐步自动化</text>
  </g>

  <text x="920" y="396" text-anchor="end" class="font tiny" fill="#94a3b8">Jerret's Blog</text>
</svg>
