<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">手动封面与 AI 封面生成流程对比</title>
  <desc id="desc">流程图对比手动 PS 或 Canva 制作封面与 AI 自动生成 SVG 封面的时间、质量和校验差异。</desc>
  <defs>
    <marker id="arrow-main" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#163b63"/>
    </marker>
    <marker id="arrow-risk" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#c2410c"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 13px; fill: #5c667a; }
      .lane-title { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 15px; font-weight: 700; fill: #172033; }
      .node-copy { font-size: 12px; fill: #5c667a; }
      .stage { font-size: 11px; font-weight: 700; letter-spacing: .5px; }
      .badge-text { font-size: 13px; font-weight: 700; }
      .small { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="20" width="920" height="520" rx="18" fill="#ffffff" stroke="#d8e0ea"/>

  <text x="480" y="56" class="title" text-anchor="middle">AI 封面生成流程：从手工设计到自动入库</text>
  <text x="480" y="78" class="subtitle" text-anchor="middle">主线保留内容理解、风格统一、SVG 输出与 lint 校验，避免封面制作成为发布瓶颈。</text>

  <rect x="44" y="100" width="872" height="152" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="70" y="128" class="lane-title" fill="#c2410c">旧流程：手动封面</text>
  <rect x="790" y="112" width="96" height="28" rx="14" fill="#ffedd5" stroke="#fb923c"/>
  <text x="838" y="131" class="badge-text" fill="#c2410c" text-anchor="middle">30min+</text>

  <g transform="translate(78 154)">
    <rect width="150" height="68" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <text x="18" y="22" class="stage" fill="#ea580c">01</text>
    <text x="75" y="30" class="node-title" text-anchor="middle">读文章</text>
    <text x="75" y="51" class="node-copy" text-anchor="middle">人工理解主题</text>
  </g>
  <g transform="translate(278 154)">
    <rect width="150" height="68" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <text x="18" y="22" class="stage" fill="#ea580c">02</text>
    <text x="75" y="30" class="node-title" text-anchor="middle">PS / Canva</text>
    <text x="75" y="51" class="node-copy" text-anchor="middle">找模板和调版式</text>
  </g>
  <g transform="translate(478 154)">
    <rect width="150" height="68" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <text x="18" y="22" class="stage" fill="#ea580c">03</text>
    <text x="75" y="30" class="node-title" text-anchor="middle">导出封面</text>
    <text x="75" y="51" class="node-copy" text-anchor="middle">尺寸和水印手查</text>
  </g>
  <g transform="translate(678 154)">
    <rect width="150" height="68" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="22" class="stage" fill="#dc2626">04</text>
    <text x="75" y="30" class="node-title" text-anchor="middle">质量风险</text>
    <text x="75" y="51" class="node-copy" text-anchor="middle">风格漂移 / 漏检</text>
  </g>
  <line x1="228" y1="188" x2="258" y2="188" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="258 180 274 188 258 196" fill="#c2410c"/>
  <line x1="428" y1="188" x2="458" y2="188" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="458 180 474 188 458 196" fill="#c2410c"/>
  <line x1="628" y1="188" x2="658" y2="188" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="658 180 674 188 658 196" fill="#c2410c"/>

  <g transform="translate(132 268)">
    <rect width="190" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="95" y="28" class="badge-text" fill="#1d4ed8" text-anchor="middle">30min -&gt; 1min</text>
  </g>
  <g transform="translate(386 268)">
    <rect width="190" height="44" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="95" y="28" class="badge-text" fill="#047857" text-anchor="middle">风格统一</text>
  </g>
  <g transform="translate(640 268)">
    <rect width="190" height="44" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="95" y="28" class="badge-text" fill="#6d28d9" text-anchor="middle">lint 校验</text>
  </g>

  <rect x="44" y="330" width="872" height="156" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="70" y="358" class="lane-title" fill="#0f766e">新流程：AI SVG 自动生成</text>
  <rect x="788" y="342" width="98" height="28" rx="14" fill="#dcfce7" stroke="#34d399"/>
  <text x="837" y="361" class="badge-text" fill="#047857" text-anchor="middle">1min</text>

  <g transform="translate(70 388)">
    <rect width="140" height="72" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="16" y="22" class="stage" fill="#059669">01</text>
    <text x="70" y="31" class="node-title" text-anchor="middle">读文章</text>
    <text x="70" y="53" class="node-copy" text-anchor="middle">上下文输入</text>
  </g>
  <g transform="translate(240 388)">
    <rect width="140" height="72" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="16" y="22" class="stage" fill="#059669">02</text>
    <text x="70" y="31" class="node-title" text-anchor="middle">提关键词</text>
    <text x="70" y="53" class="node-copy" text-anchor="middle">主题 / 隐喻 / 风格</text>
  </g>
  <g transform="translate(410 388)">
    <rect width="140" height="72" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="16" y="22" class="stage" fill="#0891b2">03</text>
    <text x="70" y="31" class="node-title" text-anchor="middle">生成 SVG</text>
    <text x="70" y="53" class="node-copy" text-anchor="middle">网格布局 / 水印</text>
  </g>
  <g transform="translate(580 388)">
    <rect width="140" height="72" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="16" y="22" class="stage" fill="#7c3aed">04</text>
    <text x="70" y="31" class="node-title" text-anchor="middle">自动校验</text>
    <text x="70" y="53" class="node-copy" text-anchor="middle">lint / xmllint</text>
  </g>
  <g transform="translate(750 388)">
    <rect width="140" height="72" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="16" y="22" class="stage" fill="#0891b2">05</text>
    <text x="70" y="31" class="node-title" text-anchor="middle">入库</text>
    <text x="70" y="53" class="node-copy" text-anchor="middle">public + src</text>
  </g>
  <line x1="210" y1="424" x2="224" y2="424" stroke="#163b63" stroke-width="5" stroke-linecap="round"/>
  <polygon points="224 414 240 424 224 434" fill="#163b63"/>
  <line x1="380" y1="424" x2="394" y2="424" stroke="#163b63" stroke-width="5" stroke-linecap="round"/>
  <polygon points="394 414 410 424 394 434" fill="#163b63"/>
  <line x1="550" y1="424" x2="564" y2="424" stroke="#163b63" stroke-width="5" stroke-linecap="round"/>
  <polygon points="564 414 580 424 564 434" fill="#163b63"/>
  <line x1="720" y1="424" x2="734" y2="424" stroke="#163b63" stroke-width="5" stroke-linecap="round"/>
  <polygon points="734 414 750 424 734 434" fill="#163b63"/>

  <text x="70" y="514" class="small">质量门禁：exactly one &lt;/svg&gt; / 无外部依赖 / 水印保留 / SVG lint 通过</text>
  <text x="924" y="530" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">Jerret's Blog</text>
</svg>
