    <text x="18" y="56" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">AI 封面</text>
    <text x="18" y="83" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#6d28d9">收益</text>
    <text x="18" y="101" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">视觉统一，出图快</text>
    <rect x="18" y="118" width="114" height="20" rx="10" fill="#ede9fe"/>
    <text x="75" y="132" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#6d28d9">Gate：审美确认</text>
  </g>

  <g transform="translate(587,118)" filter="url(#softShadow)">
