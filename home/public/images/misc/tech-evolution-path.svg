    <text x="75" y="132" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#1d4ed8">Gate：内容人审</text>
  </g>

  <g transform="translate(404,118)" filter="url(#softShadow)">
