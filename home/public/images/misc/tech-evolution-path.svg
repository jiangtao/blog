<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#2563eb"/>
    </marker>
    <filter id="softShadow" x="-18%" y="-24%" width="136%" height="148%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>
  <rect width="960" height="420" fill="url(#grid)"/>
  <rect x="24" y="22" width="912" height="376" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="480" y="58" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" letter-spacing="0" fill="#0f172a">技术演进路径</text>
  <text x="480" y="86" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#64748b">从手动博客到跨平台分发：自动化承担重复劳动，人审 gate 保留判断权</text>

  <path d="M 112 190 H 848" fill="none" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round"/>
  <path d="M 188 190 H 221" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 371 190 H 404" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 554 190 H 587" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 737 190 H 770" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(38,118)" filter="url(#softShadow)">
    <rect width="150" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <rect width="150" height="7" rx="8" fill="#64748b"/>
    <text x="18" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b">01</text>
    <text x="18" y="56" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">Hexo 手动</text>
    <text x="18" y="83" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#334155">收益</text>
    <text x="18" y="101" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">结构可控</text>
    <rect x="18" y="118" width="114" height="20" rx="10" fill="#e2e8f0"/>
    <text x="75" y="132" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#475569">Gate：全流程人审</text>
  </g>

  <g transform="translate(221,118)" filter="url(#softShadow)">
    <rect width="150" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
    <rect width="150" height="7" rx="8" fill="#2563eb"/>
    <text x="18" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2563eb">02</text>
    <text x="18" y="56" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">Astro 静态化</text>
    <text x="18" y="83" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#1d4ed8">收益</text>
    <text x="18" y="101" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">构建更快，部署稳</text>
