  <g transform="translate(72,306)">
    <rect width="816" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="22" y="27" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#1d4ed8">路线</text>
    <text x="74" y="27" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#0f172a">手动博客 → 静态性能 → 图像生产 → 发布闭环 → 分发复用</text>
    <text x="22" y="49" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#15803d">原则</text>
    <text x="74" y="49" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#0f172a">自动化负责重复劳动，人审 gate 负责判断、审美与合规</text>
