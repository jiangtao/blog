    <rect width="150" height="7" rx="8" fill="#16a34a"/>
    <text x="18" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#16a34a">04</text>
    <text x="18" y="56" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">全自动化</text>
    <text x="18" y="74" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">工作流</text>
    <text x="18" y="101" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">写作到发布闭环</text>
