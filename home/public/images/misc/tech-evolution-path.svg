    <text x="18" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#f97316">05</text>
    <text x="18" y="56" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">跨平台分发</text>
    <text x="18" y="83" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#c2410c">收益</text>
    <text x="18" y="101" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">一次写，多处发</text>
