    <text x="75" y="132" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#15803d">Gate：结果验收</text>
  </g>

  <g transform="translate(770,118)" filter="url(#softShadow)">
