<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#2563eb"/>
    </marker>
    <filter id="softShadow" x="-18%" y="-24%" width="136%" height="148%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>
  <rect width="960" height="420" fill="url(#grid)"/>
  <rect x="24" y="22" width="912" height="376" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="480" y="58" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" letter-spacing="0" fill="#0f172a">4. 知识编码化</text>
  <text x="480" y="86" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#64748b">知识从人脑迁移到可运行规则，最后进入自动执行和校验闭环</text>

  <path d="M 120 185 H 840" fill="none" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round"/>
  <path d="M 218 185 H 284" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 450 185 H 516" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 682 185 H 748" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(52,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#64748b"/>
    <circle cx="29" cy="37" r="15" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">1</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">隐性经验</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">口头判断</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">个人习惯与直觉</text>
    <rect x="20" y="101" width="58" height="18" rx="9" fill="#e2e8f0"/>
    <text x="49" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#475569">人脑</text>
  </g>

  <g transform="translate(284,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#7c3aed"/>
    <circle cx="29" cy="37" r="15" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">2</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">文档 / 规范</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">流程沉淀</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">清单、边界、示例</text>
    <rect x="20" y="101" width="58" height="18" rx="9" fill="#ede9fe"/>
    <text x="49" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#6d28d9">可读</text>
  </g>

  <g transform="translate(516,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#4f46e5"/>
    <circle cx="29" cy="37" r="15" fill="#e0e7ff" stroke="#818cf8"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3730a3">3</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">skill / rules</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">触发条件</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">可执行操作边界</text>
    <rect x="20" y="101" width="68" height="18" rx="9" fill="#e0e7ff"/>
    <text x="54" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#4338ca">可执行</text>
  </g>

  <g transform="translate(748,122)" filter="url(#softShadow)">
    <rect width="166" height="126" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <rect width="166" height="7" rx="8" fill="#2563eb"/>
    <circle cx="29" cy="37" r="15" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="29" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">4</text>
    <text x="54" y="37" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#0f172a">自动执行与校验</text>
    <text x="20" y="70" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">agent 执行</text>
    <text x="20" y="89" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="0" fill="#475569">构建、lint、验收</text>
    <rect x="20" y="101" width="68" height="18" rx="9" fill="#dcfce7"/>
    <text x="54" y="114" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="0" fill="#15803d">可验证</text>
  </g>

  <g transform="translate(72,292)">
    <rect width="260" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="20" y="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#1d4ed8">迁移方向</text>
    <text x="20" y="43" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#0f172a">人脑经验 → 规则库</text>
  </g>
  <g transform="translate(350,292)">
    <rect width="260" height="58" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="20" y="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#6d28d9">复用方式</text>
    <text x="20" y="43" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#0f172a">被阅读 → 被调用执行</text>
  </g>
  <g transform="translate(628,292)">
    <rect width="260" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="20" y="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" letter-spacing="0" fill="#15803d">质量兜底</text>
    <text x="20" y="43" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="0" fill="#0f172a">自动校验让规则闭环</text>
  </g>

  <text x="936" y="398" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Jerret's Blog</text>
