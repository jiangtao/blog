<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">AI 時代端到端交付的失衡與治理</title>
  <desc id="desc">AI 加速需求試錯與生產輸出，但收益驗證、品質保障與生產消化沒有同步跟上時，需要以組織治理閉環補齊。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="52%" stop-color="#f3f7f1"/><stop offset="100%" stop-color="#fff6ed"/></linearGradient><linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1f7a68"/><stop offset="100%" stop-color="#f08a46"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#223042" flood-opacity=".14"/></filter><marker id="arrowWarm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d66b35"/></marker><marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1f7a68"/></marker><marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3e78a4"/></marker><style>text{font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif}.heading{font-size:18px;font-weight:800}.label{font-size:14px;font-weight:800}.small{font-size:13px;font-weight:600}</style>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/><rect x="44" y="40" width="1112" height="760" rx="22" fill="#fffdf8" stroke="#d9e1da" stroke-width="1.5" filter="url(#shadow)"/><g opacity=".5" stroke="#e2e8e2"><path d="M82 124H1118M82 252H1118M82 380H1118M82 508H1118M82 636H1118M82 764H1118"/><path d="M300 76V784M540 76V784M780 76V784M1020 76V784"/></g>
  <rect x="82" y="72" width="174" height="32" rx="16" fill="#e9f4ee" stroke="#b9d7c8"/><text x="106" y="94" font-size="15" font-weight="700" fill="#1f7a68">AI NATIVE DELIVERY</text><text x="82" y="154" font-size="38" font-weight="800" fill="#1f2933">端到端交付的失衡與治理</text><rect x="82" y="176" width="420" height="7" rx="4" fill="url(#signal)"/><text x="82" y="214" font-size="18" fill="#52606d">AI 能把輸出變快，但不會自動把需求變準，也不會自動補齊交付系統。</text>
  <g transform="translate(82 254)"><text class="heading" fill="#31414f">1. 舊流程：慢，但在消化風險</text><rect x="0" y="20" width="1036" height="104" rx="18" fill="#f7faf8" stroke="#cddbd1" stroke-width="1.5"/><g class="label"><g transform="translate(26 48)"><rect width="138" height="48" rx="12" fill="#eef5ff" stroke="#b9cce4"/><text x="69" y="29" text-anchor="middle" fill="#2f5d83">需求提出</text></g><g transform="translate(198 48)"><rect width="138" height="48" rx="12" fill="#f4faf6" stroke="#bdd8c8"/><text x="69" y="29" text-anchor="middle" fill="#1f7a68">需求評審</text></g><g transform="translate(370 48)"><rect width="138" height="48" rx="12" fill="#fff7ec" stroke="#e3c39f"/><text x="69" y="29" text-anchor="middle" fill="#98572a">技術評審</text></g><g transform="translate(542 48)"><rect width="138" height="48" rx="12" fill="#eef6ff" stroke="#9dbddd"/><text x="69" y="29" text-anchor="middle" fill="#244a68">節奏推進</text></g><g transform="translate(714 48)"><rect width="138" height="48" rx="12" fill="#f3f0ff" stroke="#c8b8e6"/><text x="69" y="29" text-anchor="middle" fill="#5a4a7c">預交付</text></g><g transform="translate(886 48)"><rect width="84" height="48" rx="12" fill="#fff4ea" stroke="#e7a66e"/><text x="42" y="29" text-anchor="middle" fill="#713f1f">上線</text></g></g><g fill="none" stroke="#7b8791" stroke-width="2.2" marker-end="url(#arrowBlue)"><path d="M164 72H195M336 72H367M508 72H539M680 72H711M852 72H883"/></g></g>
  <g transform="translate(82 418)"><text class="heading" fill="#713f1f">2. AI 放大的失衡：快的是輸出，不一定是收益</text><rect x="0" y="20" width="1036" height="180" rx="18" fill="#fff8f2" stroke="#f0c0a9" stroke-width="1.5"/><g transform="translate(28 58)"><rect width="190" height="92" rx="14" fill="#fff4ea" stroke="#e7a66e"/><circle cx="30" cy="30" r="16" fill="#f08a46"/><text x="25" y="36" font-size="16" font-weight="800" fill="#fff">A</text><text class="heading" x="56" y="25" fill="#713f1f">需求端提速</text><text class="small" x="56" y="52" fill="#6d4e3a">更多想法、更多試錯</text><text class="small" x="56" y="73" fill="#6d4e3a">更多變化</text></g><g transform="translate(270 58)"><rect width="190" height="92" rx="14" fill="#eef6ff" stroke="#9dbddd"/><circle cx="30" cy="30" r="16" fill="#3e78a4"/><text x="25" y="36" font-size="16" font-weight="800" fill="#fff">B</text><text class="heading" x="56" y="25" fill="#244a68">生產端提速</text><text class="small" x="56" y="52" fill="#415d74">Coding、Demo</text><text class="small" x="56" y="73" fill="#415d74">局部執行更快</text></g><g transform="translate(512 44)"><rect width="214" height="120" rx="16" fill="#fffdf8" stroke="#d66b35" stroke-width="2.2"/><text class="heading" x="107" y="34" text-anchor="middle" fill="#9a3d22">沒有同步跟上</text><text class="small" x="107" y="63" text-anchor="middle" fill="#6d4e3a">收益驗證</text><text class="small" x="107" y="85" text-anchor="middle" fill="#6d4e3a">品質保障／生產消化</text><text class="small" x="107" y="107" text-anchor="middle" fill="#6d4e3a">監控、灰度、回滾</text></g><g transform="translate(778 58)"><rect width="206" height="92" rx="14" fill="#edf8f2" stroke="#9ccdb4"/><circle cx="30" cy="30" r="16" fill="#1f7a68"/><text x="25" y="36" font-size="16" font-weight="800" fill="#fff">C</text><text class="heading" x="56" y="25" fill="#1f5d4f">研發側承壓</text><text class="small" x="56" y="52" fill="#42685b">評審、聯調、上線</text><text class="small" x="56" y="73" fill="#42685b">回滾仍要兜住</text></g><g fill="none" stroke-width="3"><path d="M218 104H267" stroke="#d66b35" marker-end="url(#arrowWarm)"/><path d="M460 104H509" stroke="#3e78a4" marker-end="url(#arrowBlue)"/><path d="M726 104H775" stroke="#1f7a68" marker-end="url(#arrowGreen)"/></g><text x="518" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3d22">核心矛盾：需求提出、試錯與變更速度上去了，收益驗證與生產端消化沒有同步跟上</text></g>
  <text x="600" y="638" text-anchor="middle" font-size="14" font-weight="700" fill="#52606d">目標：交付需求帶來正向轉化與收益，而不是更快地產生更多變化。</text>
  <g transform="translate(82 666)"><text class="heading" fill="#1f5d4f">3. 治理閉環：讓整個組織一起增速</text><rect x="0" y="20" width="1036" height="72" rx="18" fill="#f3fbf7" stroke="#b8dcc9" stroke-width="1.5"/><g class="label"><g transform="translate(24 40)"><rect width="148" height="34" rx="10" fill="#f4faf6" stroke="#bdd8c8"/><text x="74" y="22" text-anchor="middle" fill="#1f7a68">需求驗證前置</text></g><g transform="translate(210 40)"><rect width="148" height="34" rx="10" fill="#fff7ec" stroke="#e3c39f"/><text x="74" y="22" text-anchor="middle" fill="#98572a">產品收斂變化</text></g><g transform="translate(396 40)"><rect width="160" height="34" rx="10" fill="#eef5ff" stroke="#b9cce4"/><text x="80" y="22" text-anchor="middle" fill="#2f5d83">Agent 進入系統</text></g><g transform="translate(594 40)"><rect width="156" height="34" rx="10" fill="#edf8f2" stroke="#9ccdb4"/><text x="78" y="22" text-anchor="middle" fill="#1f5d4f">品質體系兜底</text></g><g transform="translate(788 40)"><rect width="164" height="34" rx="10" fill="#f3f0ff" stroke="#c8b8e6"/><text x="82" y="22" text-anchor="middle" fill="#5a4a7c">組織共同增速</text></g></g><g fill="none" stroke="#1f7a68" stroke-width="2.4" marker-end="url(#arrowGreen)"><path d="M172 57H207M358 57H393M556 57H591M750 57H785"/></g></g>
  <text x="1116" y="784" text-anchor="end" font-size="13" font-weight="700" fill="#7b8791">Jerret's Blog</text>
</svg>
