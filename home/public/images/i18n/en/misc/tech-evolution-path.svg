<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A path from manual work to automated delivery"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#fff"/></linearGradient><pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7c3aed" opacity=".12"/></pattern><style>.eyebrow{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:2px;fill:#7c3aed}.title{font:700 39px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2e1065}.number{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7c3aed;letter-spacing:1.4px}.label{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2e1065}.note{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}</style></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dot)"/><rect x="64" y="58" width="184" height="34" rx="17" fill="#7c3aed" fill-opacity=".12"/><text x="84" y="81" class="eyebrow">JERRET'S BLOG</text><text x="64" y="158" class="title">A path from manual work to automated delivery</text><path d="M64 190h1072" stroke="#7c3aed" stroke-opacity=".28"/><path d="M76 430h1048" stroke="#7c3aed" stroke-opacity=".22" stroke-width="2"/><text x="76" y="476" class="note">A concise technical view of the system and its delivery flow.</text><g><rect x="76" y="242" width="184" height="124" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="98" y="276" class="number">01</text><text x="168" y="321" class="label" text-anchor="middle">Manual blog</text><circle cx="168" cy="344" r="5" fill="#7c3aed"/></g><path d="M270 303h28m-10-10 10 10-10 10" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="300" y="242" width="184" height="124" rx="18" fill="#fff"