<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">What I Have Seen in AI Delivery Recently</title>
  <desc id="desc">AI speeds up output, but demand validation, delivery systems, and governance must keep pace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="52%" stop-color="#f3f7f1"/><stop offset="100%" stop-color="#fff6ed"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1f7a68"/><stop offset="100%" stop-color="#f08a46"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#223042" flood-opacity=".16"/></filter>
    <marker id="warm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d66b35"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1f7a68"/></marker>
    <style>text{font-family:Arial,sans-serif}.title{font-size:50px;font-weight:800;fill:#1f2933}.copy{font-size:18px;fill:#52606d}.cardTitle{font-size:19px;font-weight:800}.cardCopy{font-size:14px;font-weight:600}.chipTitle{font-size:14px;font-weight:700}.chipCopy{font-size:11px;fill:#63736a}</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="44" y="42" width="1112" height="546" rx="22" fill="#fffdf8" stroke="#d9e1da" stroke-width="1.5" filter="url(#shadow)"/>
  <g opacity=".55" stroke="#e2e8e2"><path d="M82 126H1118M82 226H1118M82 326H1118M82 426H1118"/><path d="M300 78V552M540 78V552M780 78V552M1020 78V552"/></g>
  <rect x="82" y="76" width="174" height="32" rx="16" fill="#e9f4ee" stroke="#b9d7c8"/>
  <text x="106" y="98" font-size="15" font-weight="700" fill="#1f7a68">AI NATIVE DELIVERY</text>
  <text class="title" x="82" y="166">What I Have Seen</text>
  <text class="title" x="82" y="226">in AI Delivery</text>
  <rect x="82" y="254" width="390" height="8" rx="4" fill="url(#signal)"/>
  <text x="82" y="312" font-size="21" font-weight="700" fill="#2f3b45">Faster output does not make delivery stronger</text>
  <text class="copy" x="82" y="350">Demand moves faster, but value validation and</text>
  <text class="copy" x="82" y="378">delivery capacity do not keep pace.</text>
  <text class="copy" x="82" y="406">Uncertainty falls on engineering and delivery teams.</text>
  <g transform="translate(82 438)">
    <g><rect width="136" height="56" rx="12" fill="#f4faf6" stroke="#bdd8c8"/><text class="chipTitle" x="15" y="24" fill="#1f7a68">Validate demand</text><text class="chipCopy" x="15" y="43">value first</text></g>
    <g transform="translate(156)"><rect width="136" height="56" rx="12" fill="#fff7ec" stroke="#e3c39f"/><text class="chipTitle" x="14" y="24" fill="#98572a">Safeguard quality</text><text class="chipCopy" x="14" y="43" fill="#7f6b59">observe</text></g>
    <g transform="translate(312)"><rect width="136" height="56" rx="12" fill="#eef5ff" stroke="#b9cce4"/><text class="chipTitle" x="14" y="24" fill="#2f5d83">Share the pace</text><text class="chipCopy" x="14" y="43" fill="#607084">together</text></g>
  </g>
  <g transform="translate(604 92)">
    <rect width="472" height="424" rx="18" fill="#f7faf8" stroke="#cddbd1" stroke-width="1.5"/>
    <text x="34" y="46" font-size="20" font-weight="800" fill="#31414f">The core tension I see</text>
    <g transform="translate(34 76)"><rect width="404" height="76" rx="14" fill="#fff4ea" stroke="#e7a66e"/><circle cx="40" cy="38" r="18" fill="#f08a46"/><text x="35" y="44" font-size="18" font-weight="800" fill="#fff">1</text><text class="cardTitle" x="74" y="31" fill="#713f1f">Faster demand</text><text class="cardCopy" x="74" y="56" fill="#6d4e3a">more ideas, experiments, and change</text></g>
    <path d="M236 154V194" stroke="#d66b35" stroke-width="3" marker-end="url(#warm)"/>
    <g transform="translate(34 196)"><rect width="404" height="76" rx="14" fill="#eef6ff" stroke="#9dbddd"/><circle cx="40" cy="38" r="18" fill="#3e78a4"/><text x="35" y="44" font-size="18" font-weight="800" fill="#fff">2</text><text class="cardTitle" x="74" y="31" fill="#244a68">Engineering pressure</text><text class="cardCopy" x="74" y="56" fill="#415d74">reviews, integration, releases, and rollback remain</text></g>
    <path d="M236 274V314" stroke="#1f7a68" stroke-width="3" marker-end="url(#green)"/>
    <g transform="translate(34 316)"><rect width="404" height="76" rx="14" fill="#edf8f2" stroke="#9ccdb4"/><circle cx="40" cy="38" r="18" fill="#1f7a68"/><text x="35" y="44" font-size="18" font-weight="800" fill="#fff">3</text><text class="cardTitle" x="74" y="31" fill="#1f5d4f">Close governance gaps</text><text class="cardCopy" x="74" y="56" fill="#42685b">validate early, connect systems, protect quality</text></g>
  </g>
  <text x="82" y="552" font-size="14" fill="#6b747d">PDE / FDE / Agents / end-to-end delivery / organizational change</text><text x="1116" y="552" text-anchor="end" font-size="13" font-weight="700" fill="#7b8791">Jerret's Blog</text>
</svg>
